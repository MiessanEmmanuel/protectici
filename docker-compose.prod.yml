# Production / staging sur Dockploy (type « Docker Compose »). Les domaines sont attachés
# aux services web et backend dans l'interface Dockploy (Traefik + TLS). Aucun port publié :
# tout passe par le proxy. Toutes les valeurs viennent de l'onglet « Environment » de Dockploy
# (voir .env.example). Les variables NEXT_PUBLIC_* sont des arguments de BUILD.
#
# ATTENTION Dockploy : saisir les valeurs contenant « # » ou des caractères spéciaux entre guillemets.

x-backend-env: &backend-env
  APP_NAME: ProtectIci
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?}
  FRONTEND_URL: ${FRONTEND_URL:?}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:?}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:?}
  DB_USERNAME: ${DB_USERNAME:?}
  DB_PASSWORD: ${DB_PASSWORD:?}
  DB_SSLMODE: disable
  SESSION_DRIVER: database
  SESSION_DOMAIN: ${SESSION_DOMAIN:?}
  # "false" uniquement le temps de liens temporaires en HTTP (ex. *.traefik.me).
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_ENCRYPT: "true"
  SESSION_SAME_SITE: lax
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  CACHE_STORE: database
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  # "log" en attendant Resend (e-mails écrits dans les journaux, rien n'est envoyé).
  MAIL_MAILER: ${MAIL_MAILER:-resend}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?}
  MAIL_FROM_NAME: ProtectIci
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  NEWSLETTER_RESEND_SYNC: ${NEWSLETTER_RESEND_SYNC:-false}
  RESEND_AUDIENCE_ID: ${RESEND_AUDIENCE_ID:-}
  TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-true}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  SSR_SHARED_SECRET: ${SSR_SHARED_SECRET:?}
  NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:?}
  IP_HASH_SECRET: ${IP_HASH_SECRET:?}
  # Sans R2 : FILESYSTEM_DISK=local, MEDIA_DISK=public, DOCUMENTS_DISK=private (volume « storage »).
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-s3}
  MEDIA_DISK: ${MEDIA_DISK:-s3}
  DOCUMENTS_DISK: ${DOCUMENTS_DISK:-s3-private}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
  AWS_BUCKET: ${AWS_BUCKET:-}
  AWS_PRIVATE_BUCKET: ${AWS_PRIVATE_BUCKET:-}
  AWS_ENDPOINT: ${AWS_ENDPOINT:-}
  AWS_URL: ${AWS_URL:-}
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?}
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
      - pgbackups:/backups
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    volumes:
      - storage:/app/storage/app
    restart: unless-stopped
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    depends_on:
      db: { condition: service_healthy }
    expose: ["8080"]
    networks: [internal, default]

  worker:
    build: ./backend
    volumes:
      - storage:/app/storage/app
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
    networks: [internal, default]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null"]
      interval: 30s

  scheduler:
    build: ./backend
    volumes:
      - storage:/app/storage/app
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
    networks: [internal, default]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null"]
      interval: 30s

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
        NEXT_PUBLIC_ALLOW_INDEXING: ${NEXT_PUBLIC_ALLOW_INDEXING:-0}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_MEDIA_ORIGINS: ${NEXT_PUBLIC_MEDIA_ORIGINS:-}
        NEXT_PUBLIC_USE_MOCKS: "0"
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8080
      SESSION_COOKIE_NAME: protectici_session
      SSR_SHARED_SECRET: ${SSR_SHARED_SECRET:?}
    depends_on:
      backend: { condition: service_healthy }
    expose: ["3000"]
    networks: [default]

networks:
  # Réseau sans accès sortant ni exposition : la base n'y est joignable que par l'API.
  internal:
    internal: true

volumes:
  pgdata:
  pgbackups:
  # Fichiers déposés quand le stockage est local (MEDIA_DISK=public / DOCUMENTS_DISK=private).
  storage:
